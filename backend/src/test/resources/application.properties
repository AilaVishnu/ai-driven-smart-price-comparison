# Test configuration. Files under src/test/resources take precedence on the test
# classpath, so this replaces the dev settings during a build.
#
# In-memory and uniquely named per run, deliberately: the dev profile uses a
# file-based H2 so that fetched catalogue data survives restarts, and a test run
# sharing that file collides with a running application over the MVStore lock.
# Tests get their own throwaway database instead.
spring.datasource.url=jdbc:h2:mem:spctest;MODE=MySQL;DATABASE_TO_LOWER=TRUE;CASE_INSENSITIVE_IDENTIFIERS=TRUE;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=validate
spring.flyway.enabled=true

# No outbound calls during a build: tests must never depend on a third-party API
# being reachable, and must never spend the metered marketplace quota.
seed.catalog.enabled=false
seed.price-history.enabled=false
providers.fallback-mode=NEVER
providers.sources.dummyjson.enabled=false
providers.sources.fakestore.enabled=false
providers.sources.amazon-in.enabled=false
providers.sources.flipkart.enabled=false

security.jwt.secret=test-only-secret-key-that-is-long-enough-for-hmac-sha256-abcdef
logging.level.com.spc.pricecompare=WARN
