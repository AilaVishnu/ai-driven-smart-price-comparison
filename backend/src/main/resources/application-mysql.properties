# Production profile. Create the schema first:
#   CREATE DATABASE spcdb CHARACTER SET utf8mb4 COLLATE utf8mb4_unicode_ci;
# then run:  mvnw spring-boot:run -Dspring-boot.run.profiles=mysql
spring.datasource.url=jdbc:mysql://${MYSQL_HOST:localhost}:${MYSQL_PORT:3306}/${MYSQL_DB:spcdb}?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Kolkata&characterEncoding=utf8
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.username=${MYSQL_USER:root}
spring.datasource.password=${MYSQL_PASSWORD:root}

spring.datasource.hikari.maximum-pool-size=10

seed.price-history.enabled=false
seed.catalog.enabled=true
