spring.application.name=pricecompare
spring.profiles.active=dev

# Pulls in application-local.properties automatically, so secrets live in a file
# that is gitignored and no extra command-line flag is ever needed. A
# profile-specific file always outranks this one, which is why the key belongs
# there rather than being imported - an import would lose to the default below.
# The file is optional: the application starts normally without it.
spring.profiles.group.dev=local
spring.profiles.group.mysql=local

# Flyway owns the schema; Hibernate only validates that entities match it.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

server.port=8080
spring.jackson.default-property-inclusion=non_null

# ---------------------------------------------------------------------------
# Providers
# ---------------------------------------------------------------------------
# One free RapidAPI key covers both Indian marketplaces. Without it the app
# still starts and serves whatever is already stored, but no new listings can
# be fetched. See docs/api-keys-setup.md.
providers.rapidapi-key=${RAPIDAPI_KEY:}

# A slow marketplace must never hold up a search response.
providers.request-timeout-ms=8000
providers.search-limit=20

# --- real Indian marketplaces, via RapidAPI ---
providers.sources.amazon-in.enabled=true
providers.sources.amazon-in.primary=true
providers.sources.amazon-in.host=real-time-amazon-data.p.rapidapi.com
providers.sources.amazon-in.country=IN
# Observed free-tier limit on RapidAPI. The provider reports its own remaining
# count in a response header and that figure wins when present; this is the
# fallback used before the first call of a month.
providers.sources.amazon-in.monthly-quota=100
providers.sources.amazon-in.search-path=/search?query={q}&page=1&country=IN&sort_by=RELEVANCE

providers.sources.flipkart.enabled=true
providers.sources.flipkart.primary=true
# "Real-time Flipkart Data" (publisher: Ayush Somani). Note the trailing 2 -
# there are several near-identically named Flipkart APIs on RapidAPI and they
# are not interchangeable.
providers.sources.flipkart.host=real-time-flipkart-data2.p.rapidapi.com
providers.sources.flipkart.country=IN
# 300/month on the free plan, per the provider rate-limit header.
providers.sources.flipkart.monthly-quota=300
# Catalogue depth. Each page is one call and about 24 products, so 5 pages
# across the configured categories costs roughly 45 calls of the 300.
providers.sources.flipkart.seed-pages=5
# Never spend the last of the budget on seeding; searches need some left.
providers.sources.flipkart.quota-reserve=60
# NOTE: /product-search is paywalled on the free plan (401 "endpoint is disabled
# for your subscription"). The adapter uses /products-by-category instead, which
# IS included, so this search-path is unused for Flipkart and kept only so a
# paid plan can switch back without a code change.
providers.sources.flipkart.search-path=/product-search?q={q}&page=1


# ---------------------------------------------------------------------------
# AI / matching
# ---------------------------------------------------------------------------
matching.threshold=0.72
matching.weight.cosine=0.40
matching.weight.model=0.35
matching.weight.brand=0.25
matching.price-band-low=0.35
matching.price-band-high=3.0

# ---------------------------------------------------------------------------
# Security
# ---------------------------------------------------------------------------
# Dev-only default. Override with the JWT_SECRET env var in any real deployment.
security.jwt.secret=${JWT_SECRET:ZGV2LW9ubHktc2VjcmV0LWNoYW5nZS1tZS1pbi1wcm9kdWN0aW9uLTEyMzQ1Njc4OTA=}
security.jwt.expiration-ms=86400000
security.cors.allowed-origins=http://localhost:5173,http://127.0.0.1:5173

logging.level.com.spc.pricecompare=INFO
