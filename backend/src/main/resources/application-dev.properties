# File-based H2 in MySQL compatibility mode.
#
# Deliberately file-based rather than in-memory: every product fetched costs
# RapidAPI quota, so the catalog must survive a restart. The same Flyway
# migrations run here and on MySQL.
spring.datasource.url=jdbc:h2:file:./data/spcdb;MODE=MySQL;DATABASE_TO_LOWER=TRUE;CASE_INSENSITIVE_IDENTIFIERS=TRUE;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# Backfills 90 days of price history so the forecasting page has a series to
# work with on day one. Rows are written with source='SIMULATED' and the UI
# labels them as such - observed prices are never faked.
seed.price-history.enabled=true
seed.catalog.enabled=true

logging.level.com.spc.pricecompare=DEBUG
