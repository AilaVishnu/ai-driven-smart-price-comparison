<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Smart Price Comparison</title>
    <meta name="description" content="Compare prices, ratings and reviews across Indian shopping platforms." />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!-- Fraunces (editorial display) for headlines; Inter for UI/body text. -->
    <link
      href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400..700&family=Inter:wght@400..700&display=swap"
      rel="stylesheet"
    />
    <!-- Set the theme before first paint so the light default never flashes
         dark on a dark-OS device. Mirrors the default in AppContext. -->
    <script>
      (function () {
        try {
          var raw = localStorage.getItem('spc.theme.v2');
          var t = raw ? JSON.parse(raw) : 'light';
          if (t !== 'system') document.documentElement.setAttribute('data-theme', t);
        } catch (e) {
          document.documentElement.setAttribute('data-theme', 'light');
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
